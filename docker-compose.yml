services:

  shiny-app:
    image: klimahistorie
    container_name: klimahistorie
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "127.0.0.1:3838:3838"
    restart: unless-stopped
    environment:
      SHINY_PORT: "3838"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klimahistorie
      PGUSER: climate_reader
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_app_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sp_network
      - database_network

  postgres:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: klimahistorie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    secrets:
      - postgres_admin_password
      - postgres_app_password
      - postgres_etl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - database_network
      - database_host_access

  nginx:
    image: nginx:stable
    container_name: shiny-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - shiny-app
    networks:
      - sp_network

networks:
  sp_network:
    driver: bridge
  database_network:
    driver: bridge
    internal: true
  database_host_access:
    driver: bridge

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:-./secrets/postgres_admin_password}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:-./secrets/postgres_app_password}
  postgres_etl_password:
    file: ./secrets/postgres_etl_password


