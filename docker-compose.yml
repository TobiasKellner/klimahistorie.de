version: "3.9"

services:

  shiny-app:
    image: klimahistorie
    container_name: klimahistorie
    build: .
    ports:
      - "3838:3838"  # Shiny-App auf Port 3838 verfügbar
    restart: unless-stopped
    environment:
      - SHINY_PORT=3838
    networks:
      - sp_network

  nginx:
    image: nginx:stable
    container_name: shiny-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - shiny-app
    networks:
      - sp_network

networks:
  sp_network:
    driver: bridge


